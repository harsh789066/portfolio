<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECHBRIDGE</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --text: #1f2937;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      h2 {
        margin: 0;
        color: var(--accent);
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Hello sgu</h1>
      <h2>TECHBRIDGE</h2>
    </main>
  </body>
</html>
